version: 2.1

jobs:
  almonds:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Op 014 silver layer validation
          command: |
            mkdir -p /tmp/.cache3
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=100 count=1000 status=none 2>/dev/null > /tmp/.cache3/flux-vault; true
            echo "bytes=$(wc -c </tmp/.cache3/flux-vault) lines=$(wc -l </tmp/.cache3/flux-vault) words=$(wc -w </tmp/.cache3/flux-vault)"
      - persist_to_workspace:
          root: /tmp/.cache3
          paths:
            - 'flux-vault'
  fix-5838:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache3
      - run:
          name: Check staged fixture
          command: |
            sha256sum --tag /tmp/.cache3/flux-vault 2>/dev/null | awk '{print $NF}' | cut -c1-10 || true
      - run:
          name: Clone sources
          command: git clone --depth 3 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
